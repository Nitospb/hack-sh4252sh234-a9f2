name: Service checks
on: [push, pull_request, workflow_dispatch]
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: service/requirements.lock
      - run: pip install -r service/requirements.lock -r news_matching/requirements.lock
      - run: python -m unittest discover -s service/tests -v
      - run: python -m unittest discover -s recommendations -p 'test_*.py'
      - run: python -m unittest discover -s insight_generation -p 'test_*.py'
      - run: python -m unittest discover -s evaluation -p 'test_*.py'
      - run: python -m unittest discover -s pipeline -p 'test_*.py'
      - run: PYTHONPATH=. python -m unittest discover -s tools -p 'test_*.py'
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run lint && npm run build -- --webpack
        working-directory: frontend
      - name: Clean synthetic Docker installation
        env:
          COMPOSE_PROJECT_NAME: alfa-ci-${{ github.run_id }}
          ALFA_WEB_PORT: 33000
          ALFA_API_KEY: ''
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Wait for web startup
        run: |
          python - <<'PYCODE'
          import time, urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:33000/api/live/health', timeout=3).close()
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Web did not become ready')
          PYCODE
      - name: Smoke clean installation without paid calls
        run: python -m service.smoke --base http://127.0.0.1:33000/api/live
      - name: Dispose isolated CI containers
        if: always()
        env:
          COMPOSE_PROJECT_NAME: alfa-ci-${{ github.run_id }}
        run: docker compose down --volumes
  deploy:
    name: Deploy to /opt/alfahack
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: alfa-production-deploy
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Set DEPLOY_HOST in repository secrets}"
          : "${DEPLOY_USER:?Set DEPLOY_USER in repository secrets}"
          : "${DEPLOY_SSH_KEY:?Set DEPLOY_SSH_KEY in repository secrets}"
          : "${DEPLOY_KNOWN_HOSTS:?Set DEPLOY_KNOWN_HOSTS in repository secrets}"
          : "${DEPLOY_ENV_FILE:?Set DEPLOY_ENV_FILE in repository secrets}"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]] && (( DEPLOY_PORT >= 1 && DEPLOY_PORT <= 65535 ))
          echo "DEPLOY_PORT=$DEPLOY_PORT" >> "$GITHUB_ENV"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Check server assets
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/alfahack
          test -w .
          test -s pipeline/output/catalog.sqlite
          test -s pipeline/output/service-assets.sqlite
          test -d data
          docker compose version >/dev/null
          docker network inspect traefik_traefik_proxy >/dev/null
          REMOTE
      - name: Sync source code
        shell: bash
        run: |
          set -euo pipefail
          rsync -az --delete --delay-updates \
            --exclude='/.git/' \
            --exclude='/.env' \
            --exclude='**/.env' \
            --exclude='**/node_modules/' \
            --exclude='**/.next/' \
            --exclude='**/.venv*/' \
            --exclude='**/__pycache__/' \
            --exclude='**/output/' \
            --exclude='**/runtime/' \
            --exclude='**/models/' \
            --exclude='/data/' \
            --exclude='/imports/' \
            --exclude='/distribution/' \
            --exclude='/.release-downloads/' \
            --exclude='/training/data/' \
            --exclude='/training/labels/' \
            --exclude='/news_matching/input/' \
            --exclude='**/*.sqlite*' \
            -e "ssh -p $DEPLOY_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/opt/alfahack/"
      - name: Install server .env from CI secret
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          env_file="$(mktemp "$RUNNER_TEMP/alfa-env.XXXXXXXX")"
          trap 'rm -f "$env_file"' EXIT
          printf '%s\n' "$DEPLOY_ENV_FILE" > "$env_file"
          rsync -a --chmod=F600 \
            -e "ssh -p $DEPLOY_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            "$env_file" "$DEPLOY_USER@$DEPLOY_HOST:/opt/alfahack/.env.deploy"
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd /opt/alfahack && chmod 600 .env.deploy && mv -f .env.deploy .env'
      - name: Build, start and check service
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/alfahack
          export ALFA_REQUIRE_FULL=1
          docker compose -f compose.yaml -f compose.production.yaml up --build -d --wait --wait-timeout 180
          address="$(docker compose -f compose.yaml -f compose.production.yaml port web 3000)"
          port="${address##*:}"
          [[ "$port" =~ ^[0-9]+$ ]]
          curl --fail --silent --show-error --max-time 10 \
            "http://127.0.0.1:$port/api/live/health" >/dev/null
          docker compose -f compose.yaml -f compose.production.yaml ps
          REMOTE
